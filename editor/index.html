<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drum Pattern Generator — Hapax</title>
<style>
  :root {
    --bg: #0a0a0a; --surface: #141414; --surface2: #1e1e1e; --surface3: #282828;
    --border: #333; --text: #e0e0e0; --text2: #777; --text3: #555;
    --accent: #ff6b2b; --accent2: #ff9a5c;
    --cat-foundation: #ff3333; --cat-backbeat: #ffaa00; --cat-hihat: #33cc33;
    --cat-accent: #ff88cc; --cat-metallic: #ffcc00; --cat-texture: #88ccff;
    --cat-pitched: #3388ff; --cat-synth: #cc44cc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { max-width: 1400px; margin: 0 auto; padding: 16px; }

  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .header h1 { font-size: 16px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  .header .tag { font-size: 9px; background: var(--accent); color: #000; padding: 2px 6px; border-radius: 3px; font-weight: 800; }

  .controls { display: flex; gap: 20px; align-items: end; flex-wrap: wrap; margin-bottom: 12px; padding: 12px; background: var(--surface); border-radius: 6px; border: 1px solid var(--border); }
  .control-group { display: flex; flex-direction: column; gap: 3px; }
  .control-group label { font-size: 9px; text-transform: uppercase; color: var(--text2); letter-spacing: 1.5px; font-weight: 600; }
  .control-group .value { font-size: 13px; font-weight: 700; color: var(--accent); min-width: 36px; }
  input[type="range"] { width: 120px; accent-color: var(--accent); cursor: pointer; height: 4px; }
  select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 3px; font-family: inherit; font-size: 11px; cursor: pointer; }
  select:focus { border-color: var(--accent); outline: none; }
  .btn { padding: 8px 20px; background: var(--accent); color: #000; border: none; border-radius: 4px; font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer; letter-spacing: 1.5px; text-transform: uppercase; transition: all 0.1s; }
  .btn:hover { background: var(--accent2); }
  .btn-sm { padding: 4px 10px; font-size: 10px; letter-spacing: 0.5px; }

  .chars-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; padding: 8px 12px; background: var(--surface); border-radius: 6px; border: 1px solid var(--border); }
  .char-btn { font-size: 10px; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-family: inherit; font-weight: 600; letter-spacing: 0.5px; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); transition: all 0.1s; }
  .char-btn:hover { border-color: var(--accent); color: var(--text); }
  .char-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  /* LANE CONFIG */
  .lane-config { margin-bottom: 12px; padding: 10px 12px; background: var(--surface); border-radius: 6px; border: 1px solid var(--border); }
  .lane-config h3 { font-size: 9px; text-transform: uppercase; color: var(--text2); letter-spacing: 1.5px; font-weight: 700; margin-bottom: 8px; }
  .lane-config-grid { display: grid; grid-template-columns: 30px 1fr 120px 60px; gap: 4px 8px; align-items: center; }
  .lane-config-grid .lane-num { font-size: 10px; color: var(--text3); text-align: center; font-weight: 700; }
  .lane-config-grid input, .lane-config-grid select { font-size: 10px; padding: 3px 6px; }
  .lane-config-grid input[type="text"] { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 3px; font-family: inherit; width: 100%; }
  .lane-config-grid input[type="number"] { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 3px; font-family: inherit; width: 60px; }
  .cat-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

  .tabs { display: flex; gap: 2px; margin-bottom: 2px; }
  .tab { padding: 7px 14px; background: var(--surface); border: 1px solid var(--border); border-bottom: none; border-radius: 5px 5px 0 0; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--text2); transition: all 0.1s; letter-spacing: 0.5px; }
  .tab:hover { color: var(--text); background: var(--surface2); }
  .tab.active { color: var(--accent); background: var(--bg); border-color: var(--accent); border-bottom-color: var(--bg); }

  .grid-container { background: var(--bg); border: 1px solid var(--border); border-radius: 0 6px 6px 6px; padding: 8px 12px 12px 12px; overflow-x: auto; max-width: 100vw; margin-left: -16px; margin-right: -16px; padding-left: 28px; padding-right: 28px; }
  .step-numbers { display: flex; margin-left: 108px; margin-bottom: 4px; }
  .step-num { width: 30px; text-align: center; font-size: 8px; color: var(--text3); font-weight: 600; }
  .step-num.beat { color: var(--text2); }
  .bar-indicators { display: flex; margin-left: 108px; margin-bottom: 6px; }
  .bar-indicator { text-align: center; font-size: 9px; color: var(--accent); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 2px; }
  .grid-row { display: flex; align-items: center; margin-bottom: 1px; }
  .lane-label { width: 100px; min-width: 100px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding-right: 8px; text-align: right; }
  .step-cell { width: 30px; height: 26px; margin: 0; border-right: 1px solid #1a1a1a; border-bottom: 1px solid #1a1a1a; cursor: pointer; transition: all 0.08s; position: relative; display: flex; align-items: center; justify-content: center; }
  .step-cell:hover { background: rgba(255,255,255,0.08); }
  .step-cell.beat { background: #0e0e0e; }
  .step-cell .vel-fill { position: absolute; bottom: 0; left: 0; right: 0; border-radius: 2px 2px 0 0; transition: height 0.1s; }
  .step-cell .vel-pct { font-size: 7px; font-weight: 700; color: rgba(0,0,0,0.8); z-index: 1; text-shadow: 0 0 2px rgba(255,255,255,0.3); }

  .info { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .info-card { flex: 1; min-width: 180px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px; }
  .info-card h3 { font-size: 9px; text-transform: uppercase; color: var(--text2); margin-bottom: 6px; letter-spacing: 1.5px; font-weight: 700; }
  .info-card .stat { display: flex; justify-content: space-between; padding: 2px 0; font-size: 11px; }
  .info-card .stat .val { color: var(--accent); font-weight: 700; }
  .char-tags { display: flex; flex-wrap: wrap; gap: 3px; }
  .char-tag { font-size: 9px; padding: 2px 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; color: var(--accent); font-weight: 600; }
  .var-desc { margin-top: 10px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; color: var(--text2); line-height: 1.5; }
  .var-desc strong { color: var(--text); }
  .downloads { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .download-btn { display: flex; align-items: center; gap: 5px; padding: 6px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 10px; color: var(--text); font-weight: 600; transition: all 0.1s; }
  .download-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Drum Pattern Generator</h1>
    <span class="tag">HAPAX</span>
    <span class="tag">v3.0</span>
    <span style="flex:1"></span>
    <span style="font-size:9px;color:var(--text3)">Category-based • User-configurable lanes • 12 styles</span>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="control-group"><label>Intensity</label><input type="range" id="intensity" min="0" max="100" value="40"><span class="value" id="intensity-val">0.40</span></div>
    <div class="control-group"><label>Syncopation</label><input type="range" id="syncopation" min="0" max="100" value="20"><span class="value" id="syncopation-val">0.20</span></div>
    <div class="control-group"><label>Swing</label><input type="range" id="swing" min="50" max="75" value="50"><span class="value" id="swing-val">0.50</span></div>
    <div class="control-group"><label>Bars</label><select id="bars-override"><option value="0">Auto</option><option value="1">1</option><option value="2">2</option><option value="4">4</option><option value="8">8</option><option value="16">16</option></select></div>
    <div class="control-group"><label>Polyrhythmic</label><label style="cursor:pointer;font-size:10px"><input type="checkbox" id="polyrhythmic"> On</label></div>
    <div class="control-group"><label>Seed</label><input type="number" id="seed" value="" placeholder="random" style="width:70px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:3px;border-radius:3px;font-family:inherit;font-size:11px"></div>
    <button class="btn" onclick="generate()">GENERATE</button>
  </div>

  <!-- LANE CONFIGURATION -->
  <div class="lane-config">
    <h3>LANE CONFIGURATION (8 Hapax lanes)</h3>
    <div class="lane-config-grid" id="lane-config-grid"></div>
  </div>

  <!-- STYLE SELECTOR -->
  <div class="chars-bar" id="chars-bar"></div>

  <!-- VARIATION TABS -->
  <div class="tabs" id="tabs"></div>

  <!-- GRID -->
  <div class="grid-container">
    <div class="step-numbers" id="step-numbers"></div>
    <div class="bar-indicators" id="bar-indicators"></div>
    <div id="grid"></div>
  </div>

  <!-- INFO -->
  <div class="info">
    <div class="info-card"><h3>Pattern</h3><div class="stat"><span>Name</span><span class="val" id="info-name">—</span></div><div class="stat"><span>Bars</span><span class="val" id="info-bars">—</span></div><div class="stat"><span>Steps</span><span class="val" id="info-steps">—</span></div><div class="stat"><span>Swing</span><span class="val" id="info-swing">—</span></div></div>
    <div class="info-card"><h3>Metrics</h3><div class="stat"><span>Density</span><span class="val" id="info-density">—</span></div><div class="stat"><span>Syncopation</span><span class="val" id="info-syncopation">—</span></div><div class="stat"><span>Events</span><span class="val" id="info-count">—</span></div></div>
    <div class="info-card"><h3>Characteristics</h3><div class="char-tags" id="info-chars"></div></div>
  </div>
  <div class="var-desc" id="var-desc" style="display:none"></div>
  <div class="downloads" id="downloads"></div>
</div>

<script src="engine.js"></script>
<script>
  let currentPattern = null;
  let currentVariations = [];
  let activeTab = 'base';
  let selectedChars = ['hypnotic'];
  let userLanes = JSON.parse(JSON.stringify(DrumEngine.DEFAULT_LANES));

  // Category color map
  const catColors = {
    foundation: 'var(--cat-foundation)', backbeat: 'var(--cat-backbeat)',
    hihat: 'var(--cat-hihat)', accent: 'var(--cat-accent)',
    metallic: 'var(--cat-metallic)', texture: 'var(--cat-texture)',
    pitched: 'var(--cat-pitched)', synth: 'var(--cat-synth)',
  };

  // ─── LANE CONFIG UI ───────────────────────────────────────

  function initLaneConfig() {
    const grid = document.getElementById('lane-config-grid');
    grid.innerHTML = '';

    for (let i = 0; i < 8; i++) {
      const lane = userLanes[i];

      // Lane number
      const num = document.createElement('div');
      num.className = 'lane-num';
      num.textContent = i + 1;
      grid.appendChild(num);

      // Name input
      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.value = lane.name;
      nameInput.onchange = () => { lane.name = nameInput.value; };
      grid.appendChild(nameInput);

      // Category dropdown
      const catSelect = document.createElement('select');
      for (const [key, cat] of Object.entries(DrumEngine.CATEGORIES)) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = cat.label;
        if (key === lane.category) opt.selected = true;
        catSelect.appendChild(opt);
      }
      catSelect.onchange = () => { lane.category = catSelect.value; };
      catSelect.style.color = catColors[lane.category] || 'var(--text)';
      grid.appendChild(catSelect);

      // MIDI note
      const noteInput = document.createElement('input');
      noteInput.type = 'number';
      noteInput.value = lane.midiNote;
      noteInput.min = 0;
      noteInput.max = 127;
      noteInput.onchange = () => { lane.midiNote = parseInt(noteInput.value) || 36; };
      grid.appendChild(noteInput);
    }

    // Quick presets
    const presetRow = document.createElement('div');
    presetRow.style.gridColumn = '1 / -1';
    presetRow.style.marginTop = '6px';
    presetRow.style.display = 'flex';
    presetRow.style.gap = '6px';

    const presets = [
      { name: 'Default', lanes: DrumEngine.DEFAULT_LANES },
      { name: 'Hardgroove', lanes: [
        { name: "HH Closed", category: "hihat", midiNote: 42 },
        { name: "Ride", category: "hihat", midiNote: 51 },
        { name: "Conga Hi", category: "pitched", midiNote: 63 },
        { name: "Shaker", category: "accent", midiNote: 70 },
        { name: "Perc", category: "accent", midiNote: 56 },
        { name: "Clap", category: "backbeat", midiNote: 39 },
        { name: "Snare", category: "backbeat", midiNote: 38 },
        { name: "Kick", category: "foundation", midiNote: 36 },
      ]},
      { name: 'Tribal', lanes: [
        { name: "Bell", category: "accent", midiNote: 56 },
        { name: "Conga Low", category: "pitched", midiNote: 64 },
        { name: "Conga Hi", category: "pitched", midiNote: 63 },
        { name: "Shaker", category: "texture", midiNote: 70 },
        { name: "Tom Low", category: "pitched", midiNote: 41 },
        { name: "HH Closed", category: "hihat", midiNote: 42 },
        { name: "Clap", category: "backbeat", midiNote: 39 },
        { name: "Kick", category: "foundation", midiNote: 36 },
      ]},
      { name: 'Industrial', lanes: [
        { name: "HH Closed", category: "hihat", midiNote: 42 },
        { name: "HH Open", category: "hihat", midiNote: 46 },
        { name: "Stab", category: "synth", midiNote: 80 },
        { name: "Metal Hit", category: "metallic", midiNote: 52 },
        { name: "Rimshot", category: "backbeat", midiNote: 37 },
        { name: "Clap", category: "backbeat", midiNote: 39 },
        { name: "Snare", category: "backbeat", midiNote: 38 },
        { name: "Kick", category: "foundation", midiNote: 36 },
      ]},
    ];

    for (const p of presets) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm';
      btn.textContent = p.name;
      btn.style.background = 'var(--surface2)';
      btn.style.color = 'var(--text2)';
      btn.style.border = '1px solid var(--border)';
      btn.onclick = () => {
        userLanes = JSON.parse(JSON.stringify(p.lanes));
        initLaneConfig();
      };
      presetRow.appendChild(btn);
    }
    grid.appendChild(presetRow);
  }

  // ─── STYLE SELECTOR ────────────────────────────────────────

  function initChars() {
    const bar = document.getElementById('chars-bar');
    bar.innerHTML = '<span style="font-size:9px;color:var(--text3);font-weight:700;letter-spacing:1px;margin-right:6px;">STYLE:</span>';
    for (const [key, preset] of Object.entries(DrumEngine.CHARACTERISTIC_PRESETS)) {
      const btn = document.createElement('button');
      btn.className = 'char-btn' + (selectedChars.includes(key) ? ' active' : '');
      btn.textContent = preset.label;
      btn.title = preset.desc;
      btn.onclick = () => {
        if (selectedChars.includes(key)) { if (selectedChars.length > 1) selectedChars = selectedChars.filter(c => c !== key); }
        else selectedChars.push(key);
        initChars();
      };
      bar.appendChild(btn);
    }
  }

  // ─── SLIDER UPDATES ────────────────────────────────────────

  ['intensity','syncopation','swing'].forEach(id => {
    const el = document.getElementById(id);
    const val = document.getElementById(id + '-val');
    el.addEventListener('input', () => val.textContent = (el.value / 100).toFixed(2));
  });

  // ─── GENERATE ──────────────────────────────────────────────

  function generate() {
    const intensity = document.getElementById('intensity').value / 100;
    const syncopation = document.getElementById('syncopation').value / 100;
    const swing = document.getElementById('swing').value / 100;
    const poly = document.getElementById('polyrhythmic').checked;
    const seedVal = document.getElementById('seed').value;
    const seed = seedVal ? parseInt(seedVal) : null;
    const barsVal = parseInt(document.getElementById('bars-override').value);
    const bars = barsVal > 0 ? barsVal : null;

    currentPattern = DrumEngine.generatePattern({
      intensity, syncopation, swingRatio: swing,
      polyrhythmic: poly, characteristics: selectedChars,
      lanes: userLanes, seed, bars
    });
    currentVariations = DrumEngine.generateVariations(currentPattern);
    activeTab = 'base';
    renderAll();
  }

  function renderAll() { renderTabs(); renderGrid(); renderInfo(); renderDownloads(); }

  function renderTabs() {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    const baseTab = document.createElement('div');
    baseTab.className = 'tab' + (activeTab === 'base' ? ' active' : '');
    baseTab.textContent = 'Base';
    baseTab.onclick = () => { activeTab = 'base'; renderAll(); };
    tabs.appendChild(baseTab);
    for (const v of currentVariations) {
      const tab = document.createElement('div');
      tab.className = 'tab' + (activeTab === v.type ? ' active' : '');
      tab.textContent = v.name;
      tab.onclick = () => { activeTab = v.type; renderAll(); };
      tabs.appendChild(tab);
    }
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    const stepNums = document.getElementById('step-numbers');
    const barInd = document.getElementById('bar-indicators');
    grid.innerHTML = ''; stepNums.innerHTML = ''; barInd.innerHTML = '';

    const data = activeTab === 'base' ? currentPattern : currentVariations.find(v => v.type === activeTab);
    if (!data || !currentPattern) return;
    const totalSteps = currentPattern.bars * currentPattern.stepsPerBar;

    for (let i = 0; i < totalSteps; i++) {
      const num = document.createElement('div');
      num.className = 'step-num' + (i % 4 === 0 ? ' beat' : '');
      num.textContent = (i % 16) + 1;
      stepNums.appendChild(num);
    }
    for (let bar = 0; bar < currentPattern.bars; bar++) {
      const ind = document.createElement('div');
      ind.className = 'bar-indicator';
      ind.style.width = (currentPattern.stepsPerBar * 30) + 'px';
      ind.textContent = `BAR ${bar + 1}`;
      barInd.appendChild(ind);
    }

    for (const lane of currentPattern.lanes) {
      const row = document.createElement('div');
      row.className = 'grid-row';
      const label = document.createElement('div');
      label.className = 'lane-label';
      label.textContent = lane.name;
      label.style.color = catColors[lane.category] || 'var(--text)';
      row.appendChild(label);

      const steps = data.steps[lane.name] || [];
      const vels = data.velocity[lane.name] || [];

      for (let i = 0; i < totalSteps; i++) {
        const cell = document.createElement('div');
        cell.className = 'step-cell';
        if (i % 4 === 0) cell.classList.add('beat');
        const isOn = steps[i] === 1;
        if (isOn) {
          const vel = vels[i] || 100;
          const pct = Math.round((vel / 127) * 100);
          const fill = document.createElement('div');
          fill.className = 'vel-fill';
          fill.style.height = pct + '%';
          fill.style.background = catColors[lane.category] || 'var(--accent)';
          fill.style.opacity = '0.85';
          cell.appendChild(fill);
          if (pct > 20) { const txt = document.createElement('div'); txt.className = 'vel-pct'; txt.textContent = pct; cell.appendChild(txt); }
        } else { cell.style.background = '#111'; }
        cell.onclick = () => toggleStep(lane.name, i);
        row.appendChild(cell);
      }
      grid.appendChild(row);
    }
  }

  function toggleStep(laneName, stepIdx) {
    const data = activeTab === 'base' ? currentPattern : currentVariations.find(v => v.type === activeTab);
    if (!data) return;
    const steps = data.steps[laneName];
    if (!steps) return;
    steps[stepIdx] = steps[stepIdx] ? 0 : 1;
    if (data.velocity && data.velocity[laneName]) data.velocity[laneName][stepIdx] = steps[stepIdx] ? 100 : 0;
    renderGrid(); renderInfo();
  }

  function renderInfo() {
    const data = activeTab === 'base' ? currentPattern : currentVariations.find(v => v.type === activeTab);
    if (!data || !currentPattern) return;
    const allSteps = Object.values(data.steps || {}).flat();
    const totalSteps = currentPattern.bars * currentPattern.stepsPerBar;
    document.getElementById('info-name').textContent = data.name || currentPattern.name;
    document.getElementById('info-bars').textContent = currentPattern.bars;
    document.getElementById('info-steps').textContent = totalSteps;
    document.getElementById('info-swing').textContent = (currentPattern.swingRatio || 0.5).toFixed(2);
    const density = DrumEngine.calculateEventDensity(allSteps);
    const events = allSteps.reduce((a, b) => a + b, 0);
    document.getElementById('info-density').textContent = (density * 100).toFixed(1) + '%';
    document.getElementById('info-count').textContent = events;
    const fbLane = currentPattern.lanes.find(l => l.category === "foundation");
    const sync = fbLane ? DrumEngine.calculateSyncopation(data.steps[fbLane.name] || []) : 0;
    document.getElementById('info-syncopation').textContent = (sync * 100).toFixed(1) + '%';
    const chars = activeTab === 'base' ? (currentPattern.characteristics || []) : [];
    document.getElementById('info-chars').innerHTML = chars.map(c => `<span class="char-tag">${c}</span>`).join('');
    const descEl = document.getElementById('var-desc');
    if (activeTab !== 'base' && data.description) { descEl.style.display = 'block'; descEl.innerHTML = `<strong>${data.name}:</strong> ${data.description}`; }
    else { descEl.style.display = 'none'; }
  }

  function renderDownloads() {
    const dl = document.getElementById('downloads');
    dl.innerHTML = '';
    if (!currentPattern) return;
    const safeName = currentPattern.name.toLowerCase().replace(/\s+/g, '_');
    dl.appendChild(createDLBtn('Base .mid', () => DrumEngine.exportMidi(currentPattern, null, `${safeName}_base.mid`)));
    for (const v of currentVariations) dl.appendChild(createDLBtn(`${v.name} .mid`, () => DrumEngine.exportMidi(currentPattern, v, `${safeName}_${v.type}.mid`)));
  }

  function createDLBtn(label, fn) {
    const btn = document.createElement('button');
    btn.className = 'download-btn';
    btn.innerHTML = `&#11015; ${label}`;
    btn.onclick = fn;
    return btn;
  }

  // ─── INIT ──────────────────────────────────────────────────

  initLaneConfig();
  initChars();
  generate();
</script>
</body>
</html>
